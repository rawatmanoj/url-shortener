services:
  fastapi:
    build: .
    env_file:
      - .env.fastapi
    depends_on:
      - pgbouncer
      - redis

  postgres:
    image: postgres:17
    ports:
      - "15432:5432"
    env_file:
      - .env.postgres
    volumes:
      - url-shortener-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8

  nginx:
    image: nginx:1.29
    ports:
      - "8443:8443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - fastapi

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    volumes:
      - ./pgbouncer:/etc/pgbouncer:ro
    depends_on:
      - postgres
  alembic:
   build: .
   env_file:
    - .env.fastapi
   depends_on:
    - pgbouncer
   volumes:
    - .:/app
   command: ["echo", "Alembic container - use docker compose run to execute migrations"]

volumes:
  url-shortener-postgres-data:
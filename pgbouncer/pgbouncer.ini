[databases]
url_shortener = host=postgres port=5432 dbname=url_shortener user=manoj

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

default_pool_size = 2

max_client_conn = 100

log_connections = 1
log_disconnections = 1